name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Check for native libraries (Google Play 16 KB page size requirement)
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E '\.so$'; then
            echo "::warning::The APK contains native libraries. Make sure they are 16 KB aligned."
          else
            echo "No native libraries in the APK."
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # The real app/google-services.json is not in the repository. Build once with a placeholder
      # to make sure the Google Services plugin works with this AGP version.
      - name: Build with a placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.plcoding.spotifycloneyt" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder-api-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          ./gradlew --stacktrace :app:assembleDebug
          rm app/google-services.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 12 (2021) and Android 17 (2026), the newest release.
        api-level: [ 31, 37 ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests on the emulator
        timeout-minutes: 45
        run: .github/scripts/run-instrumented-tests.sh ${{ matrix.api-level }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            emulator.log
